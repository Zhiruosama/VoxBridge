<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>VoxBridge</title>
    <style>
      html {
        color-scheme: dark;
        background: #1e1e1e;
        color: #ececee;
      }
      html[data-theme='light'] {
        color-scheme: light;
        background: #fafaf9;
        color: #242426;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      .startup {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: var(--bg, #1e1e1e);
        color: var(--text, #ececee);
        pointer-events: none;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        user-select: none;
      }
      html[data-theme='light'] .startup {
        background: var(--bg, #fafaf9);
        color: var(--text, #242426);
      }
      .startup-leaving {
        animation: startup-dismiss 520ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }
      @keyframes startup-dismiss {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      .startup-brand {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      .startup-wave {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        width: 56px;
        height: 44px;
        margin-bottom: 4px;
      }
      .startup-wave i {
        display: block;
        width: 4px;
        height: 28px;
        border-radius: 3px;
        background: currentColor;
        transform: scaleY(0.35);
        animation: startup-wave 1.2s ease-in-out infinite;
      }
      .startup-wave i:nth-child(2),
      .startup-wave i:nth-child(4) {
        height: 38px;
        animation-delay: 120ms;
      }
      .startup-wave i:nth-child(3) {
        height: 44px;
        animation-delay: 240ms;
      }
      .startup-caption {
        font-size: 13px;
        color: #a4a4ae;
        line-height: 1.6;
      }
      html[data-theme='light'] .startup-caption {
        color: #62626a;
      }
      .startup-en,
      .startup-ru,
      html[data-language='en'] .startup-zh,
      html[data-language='ru'] .startup-zh {
        display: none;
      }
      html[data-language='en'] .startup-en,
      html[data-language='ru'] .startup-ru {
        display: inline;
      }
      .startup-retry {
        pointer-events: auto;
        border: 1px solid #73737a;
        border-radius: 10px;
        padding: 8px 16px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .startup-retry[hidden] {
        display: none;
      }
      .startup-retry:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }
      html[data-overlay='true'],
      html[data-overlay='true'] body {
        background: transparent;
      }
      html[data-overlay='true'] .startup {
        display: none;
      }
      @keyframes startup-wave {
        0%,
        100% {
          transform: scaleY(0.35);
          opacity: 0.5;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-leaving {
          animation: none;
          opacity: 0;
        }
        .startup-wave i {
          animation: none;
          transform: scaleY(0.7);
        }
      }
    </style>
    <script src="/startup.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div class="startup" id="startup-screen" role="status" aria-live="polite">
      <div class="startup-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="startup-brand">VoxBridge</div>
      <div class="startup-caption" id="startup-caption">
        <span class="startup-zh">正在启动…</span><span class="startup-en">Starting…</span
        ><span class="startup-ru">Запуск…</span>
      </div>
      <button class="startup-retry" id="startup-retry" type="button" hidden>
        <span class="startup-zh">重新加载</span><span class="startup-en">Reload</span
        ><span class="startup-ru">Перезагрузить</span>
      </button>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
