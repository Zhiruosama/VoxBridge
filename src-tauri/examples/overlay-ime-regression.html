<!doctype html>
<meta charset="utf-8" />
<style>
body{font:16px system-ui;background:#202024;color:#eee;padding:28px;margin:0}textarea{box-sizing:border-box;width:100%;height:100px;font:20px system-ui;background:#303034;color:white;border:1px solid #666;border-radius:12px;padding:12px}button{margin:14px 8px 0 0;font:14px system-ui;padding:8px}p{font-size:13px;color:#bbb}
</style>
<h2>VoxBridge · 输入法测试</h2>
<p>只在本机测试键盘输入，不读取配置、不发送文字。</p>
<textarea aria-label="输入法测试" placeholder="点击后输入拼音"></textarea>
<button id="reset">结束输入</button><button id="finish">完成测试</button>
<p id="state">候选词应显示在光标旁边</p>
<script type="module">
import { invoke } from '@tauri-apps/api/core';
const editor=document.querySelector('textarea');
editor.addEventListener('focus',()=>invoke('set_overlay_text_input',{active:true}).catch(e=>{document.querySelector('#state').textContent=String(e)}));
document.querySelector('#reset').onclick=()=>invoke('set_overlay_text_input',{active:false});
document.querySelector('#finish').onclick=()=>invoke('finish_ime_probe');
</script>
