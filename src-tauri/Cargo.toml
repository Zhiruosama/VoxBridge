[package]
name = "voxbridge"
version = "0.1.0"
description = "Desktop voice bridge"
edition = "2021"
rust-version = "1.96"

[lib]
name = "voxbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
tokio-util = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
cpal = "0.17.3"
url = "2"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "wav"] }
hex = "0.4"
base64 = "0.22.1"
rtrb = "=0.3.2"
ring = "0.17.14"
zeroize = "1"
whatlang = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFArray", "CFNumber"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSUUID", "NSValue", "NSBundle", "NSURL"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
