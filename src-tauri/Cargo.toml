[package]
name = "voxbridge"
version = "0.5.2"
description = "Desktop voice bridge"
edition = "2021"
rust-version = "1.96"

[lib]
name = "voxbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
tokio-util = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
cpal = "0.17.3"
url = "2"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "wav"] }
hex = "0.4"
base64 = "0.22.1"
rtrb = "=0.3.2"
ring = "0.17.14"
zeroize = "1"
whatlang = "0.18"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
security-framework = "3.7"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFArray", "CFNumber"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSApplication", "NSTextInputContext", "NSWorkspace", "NSWindow", "NSView", "NSScreen", "NSPanel", "NSEvent", "NSColor", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSUUID", "NSValue", "NSBundle", "NSURL", "NSNotification"] }

[target.'cfg(target_os = "windows")'.dependencies]
lingua = { version = "1.8", default-features = false, features = ["chinese", "english", "finnish", "french", "german", "indonesian", "japanese", "korean", "russian", "spanish"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_WinRT", "Security_Authorization_AppCapabilityAccess"] }

[dev-dependencies]
minisign-verify = "0.3"
tokio = { version = "1", features = ["test-util"] }
