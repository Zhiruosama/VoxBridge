<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="388" viewBox="0 0 1120 388" role="img" aria-labelledby="title desc">
  <title id="title">VoxBridge 的听取和表达工作流</title>
  <desc id="desc">听取：应用声音经过语音识别和翻译，成为双语字幕。表达：输入文字经过可选翻译和语音合成，送入虚拟麦克风和 Discord，同时可在本地耳机试听。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l4 3-4 3" fill="none" stroke="#7d8998" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .heading{font-size:21px;font-weight:650;fill:#1d2939}.label{font-size:18px;font-weight:600;fill:#27354a}.small{font-size:14px;fill:#64748b}.line{fill:none;stroke:#93a0af;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="386" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="30" y="31" width="4" height="23" rx="2" fill="#4478be"/><text x="47" y="50" class="heading">听取 · 应用声音变成字幕</text>
  <g transform="translate(30 78)">
    <rect width="226" height="82" rx="13" fill="#fff" stroke="#dce3ed"/>
    <rect x="18" y="24" width="30" height="25" rx="5" fill="none" stroke="#4478be" stroke-width="1.8"/><path d="M19 31h28" stroke="#4478be" stroke-width="1.8"/>
    <text x="63" y="35" class="label">应用声音</text><text x="63" y="59" class="small">Chrome / 微信等</text>
    <path d="M237 41h27" class="line"/>
    <g transform="translate(278)"><rect width="226" height="82" rx="13" fill="#fff" stroke="#dce3ed"/><text x="22" y="35" class="label">语音识别</text><text x="22" y="59" class="small">流式识别 / 短音频</text></g>
    <path d="M515 41h27" class="line"/>
    <g transform="translate(556)"><rect width="226" height="82" rx="13" fill="#fff" stroke="#dce3ed"/><text x="22" y="35" class="label">短句翻译</text><text x="22" y="59" class="small">保留上下文与已提交字幕</text></g>
    <path d="M793 41h27" class="line"/>
    <g transform="translate(834)"><rect width="226" height="82" rx="13" fill="#edf4fe" stroke="#cadcf7"/><text x="22" y="35" class="label">双语字幕</text><text x="22" y="59" class="small">主窗口 / 悬浮窗</text></g>
  </g>
  <path d="M30 190h1060" stroke="#e2e8f0"/>
  <rect x="30" y="218" width="4" height="23" rx="2" fill="#348470"/><text x="47" y="237" class="heading">表达 · 输入文字变成语音</text>
  <g transform="translate(30 265)">
    <rect width="226" height="82" rx="13" fill="#fff" stroke="#dce3ed"/><text x="22" y="35" class="label">输入文字</text><text x="22" y="59" class="small">原文 / 译文</text>
    <path d="M237 41h27" class="line"/>
    <g transform="translate(278)"><rect width="226" height="82" rx="13" fill="#fff" stroke="#dce3ed"/><text x="22" y="35" class="label">翻译 · 可选</text><text x="22" y="59" class="small">选择要表达的目标语言</text></g>
    <path d="M515 41h27" class="line"/>
    <g transform="translate(556)"><rect width="226" height="82" rx="13" fill="#fff" stroke="#dce3ed"/><text x="22" y="35" class="label">语音合成</text><text x="22" y="59" class="small">可同时在本地耳机试听</text></g>
    <path d="M793 41h27" class="line"/>
    <g transform="translate(834)"><rect width="226" height="82" rx="13" fill="#edf8f4" stroke="#c9e5da"/><text x="22" y="35" class="label">VoxBridge 麦克风</text><text x="22" y="59" class="small">发送到 Discord 等应用</text></g>
  </g>
</svg>
