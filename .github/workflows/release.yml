name: Release macOS test build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate version, architecture and release notes
        run: |
          test "$(uname -m)" = arm64
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); const t=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")); if (`v${p.version}` !== process.env.GITHUB_REF_NAME || p.version !== t.version) throw new Error("Release tag and app versions differ");'
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Build driver and test native code
        run: |
          bash native/macos/virtual-mic/build.sh
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1
      - name: Build DMG and verify app signature and microphone entitlement
        run: npm run desktop:build:mac
      - name: Prepare download and checksum
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/
          cd release-assets
          shasum -a 256 *.dmg > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - name: Retain release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release-assets/
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "VoxBridge ${GITHUB_REF_NAME#v} 测试版" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/*.dmg release-assets/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --title "VoxBridge ${GITHUB_REF_NAME#v} 测试版" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
