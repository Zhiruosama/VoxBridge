name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:release
      - run: npm run build
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      # Tauri's build script validates bundled resources during cargo test too.
      # Prepare them on a clean runner before compiling, rather than relying on
      # the later desktop build hook or a developer's local cache.
      - name: Prepare platform desktop resources
        run: node scripts/build-desktop-resources.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run desktop:build:windows
      - name: Retain Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-11-arm' && 'windows-arm64-nsis' || 'windows-nsis' }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - if: runner.os == 'macOS'
        run: bash native/macos/build-probe.sh
